<p-menubar [model]="items">
    <ng-template #start>
        <h1 routerLink="/"><span>Film</span>base</h1>
    </ng-template>
    
    <ng-template #end>
        @if (user$ | async){
            <div class="row">
                <h2>{{user$.value?.username}}</h2>
                <a routerLink="/profile">
                    <p-avatar icon="pi pi-user" shape="circle"/>
                </a>
            </div>
        }
        @else {
            <div class="gap">
                <p-button icon="pi pi-user" label="Log in" routerLink="/login"></p-button>
            </div>
        }
    </ng-template>
</p-menubar>
