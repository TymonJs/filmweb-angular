@if (products.length > 0){
@for (p of products; track $index){
<div class="prod">
  <input type="checkbox" [id]="'box' + $index" (change)="onCheckedProduct(p)" [checked]="checkedProducts.includes(p)">
  <label [for]="'box' + $index" [class.checked]="checkedProducts.includes(p)">{{ p }}</label>
  <button (click)="onRemoveProduct(p)">Usuń</button>
</div>
}
<button (click)="onRemoveChecked()">Usuń kupione</button>
}
