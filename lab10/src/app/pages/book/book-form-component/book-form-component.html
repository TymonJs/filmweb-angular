<form [formGroup]="form">
    @if (editingId) {
        <h2>Edytuj Książkę</h2>
    }
    @else {
        <h2>Dodaj książkę</h2>
    }

    <div class="data-container">
        <div class="data">
            <label for="author">Autor</label>
            <input type="text" name="author" formControlName="author">
        </div>
        <div class="data">
            <label for="title">Tytuł</label>
            <input type="text" name="title" formControlName="title">
        </div>
    </div>

    @if (editingId){
        <button (click)="edit(editingId, form)">Edytuj</button>
    }
    @else {
        <button (click)="submit(form)">Dodaj</button>
    }
</form>
