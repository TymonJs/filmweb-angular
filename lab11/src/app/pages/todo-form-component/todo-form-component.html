<form [formGroup]="form">

    <label for="name">Nazwa: </label>
    <input type="text" formControlName="name" name="name">
    @if(todo){
        <br>
        <label for="completed">Ukończony: </label>
        <input type="checkbox" name="completed" formControlName="isComplete" value="true">
    }
    <br>
    @if(todo){
        <button (click)="edit(form)" [disabled]="form.invalid">Edytuj</button>
    }
    @else {
        <button (click)="add(form)" [disabled]="form.invalid">Dodaj</button>
    }
</form>
